version: 1.3.17
cache: true

interface:
  modelSelect: true
  parameters: true
  presets: true
  agents:
    use: true
    create: true
    share: false
    public: false
  privacyPolicy:
    externalUrl: ''
  termsOfService:
    externalUrl: ''

modelSpecs:
  addedEndpoints:
    - anthropic
    - openAI
    - agents
  list:
    - name: claude-sonnet-5-5-default
      label: Claude Sonnet 5.5
      description: Default Claude model for new chats.
      default: true
      preset:
        endpoint: anthropic
        model: claude-sonnet-5-5

mcpSettings:
  allowedDomains:
    # The KnowledgeBase-S MCP (https://swanny.laughtale.co.uk/mcp) is added via the
    # LibreChat UI and stored in MongoDB, not defined below; keep it allowed here.
    - swanny.laughtale.co.uk
    - https://swanny.laughtale.co.uk
    - search-mcp
    - http://search-mcp:7879
    - localhost

mcpServers:
  web-search:
    type: streamable-http
    url: http://search-mcp:7879/mcp
    timeout: 30000

# Model names and provider keys are configured through docker-compose.yml:
#   ANTHROPIC_API_KEY, ANTHROPIC_MODELS
#   OPENAI_API_KEY, OPENAI_MODELS
