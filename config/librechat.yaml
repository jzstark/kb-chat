version: 1.2.1
cache: true

interface:
  modelSelect: true
  parameters: true
  presets: true
  agents:
    use: true
    create: true
    share: false
    public: false
  privacyPolicy:
    externalUrl: ''
  termsOfService:
    externalUrl: ''

modelSpecs:
  addedEndpoints:
    - anthropic
    - openAI
    - agents
  list:
    - name: claude-sonnet-5
      label: Claude Sonnet 5
      description: Latest Sonnet model for coding, tool use, and complex knowledge work.
      preset:
        endpoint: anthropic
        model: claude-sonnet-5
    - name: claude-sonnet-4-6-default
      label: Claude Sonnet 4.6
      description: Default Claude model for new chats.
      default: true
      preset:
        endpoint: anthropic
        model: claude-sonnet-4-6

mcpSettings:
  allowedDomains:
    - swanny.laughtale.co.uk
    - https://swanny.laughtale.co.uk
    - search-mcp
    - http://search-mcp:7879
    - localhost

mcpServers:
  knowledgebase:
    # kb-mcp moved into the KnowledgeBase-S stack; reach it over its public URL
    # with the shared inbound token (MCP_STATIC_TOKEN from the environment).
    type: streamable-http
    url: https://swanny.laughtale.co.uk/mcp
    headers:
      X-MCP-Token: "${MCP_STATIC_TOKEN}"
    timeout: 30000

  web-search:
    type: sse
    url: http://search-mcp:7879/sse
    timeout: 30000

# Model names and provider keys are configured through docker-compose.yml:
#   ANTHROPIC_API_KEY, ANTHROPIC_MODELS
#   OPENAI_API_KEY, OPENAI_MODELS
