server {
    listen 80 default_server;
    server_name chat.laughtale.co.uk _;

    client_max_body_size 100m;

    # Resolve librechat through Docker's DNS on each request (cached 10s) instead of
    # once at startup, so recreating the librechat container doesn't leave a stale IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $librechat_upstream librechat:3080;

    location / {
        proxy_pass http://$librechat_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;

        sub_filter_once on;
        sub_filter '</head>' '<script src="/assets/login-logo.js" defer></script></head>';
    }
}
