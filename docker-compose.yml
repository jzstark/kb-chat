services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    command: ["--wiredTigerCacheSizeGB", "0.5"]
    volumes:
      - ./data/mongo:/data/db

  meilisearch:
    image: getmeili/meilisearch:v1.7
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - ./data/meili:/meili_data

  # kb-mcp now lives in the KnowledgeBase-S stack and is reached over its public
  # URL (https://swanny.laughtale.co.uk/mcp). See config/librechat.yaml.

  search-mcp:
    image: ghcr.io/${GITHUB_OWNER:-owner}/kb-chat-search-mcp:latest
    build:
      context: ./services/search-mcp
    restart: unless-stopped
    environment:
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      PORT: 7879
    expose:
      - "7879"

  librechat:
    image: ghcr.io/danny-avila/librechat:latest
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    environment:
      HOST: 0.0.0.0
      PORT: 3080
      MONGO_URI: mongodb://mongodb:27017/LibreChat
      MEILI_HOST: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      JWT_SECRET: ${LIBRECHAT_JWT_SECRET}
      JWT_REFRESH_SECRET: ${LIBRECHAT_JWT_REFRESH_SECRET}
      CREDS_KEY: ${LIBRECHAT_CREDS_KEY}
      CREDS_IV: ${LIBRECHAT_CREDS_IV}
      DOMAIN_CLIENT: ${LIBRECHAT_DOMAIN_CLIENT:-https://chat.laughtale.co.uk}
      DOMAIN_SERVER: ${LIBRECHAT_DOMAIN_SERVER:-https://chat.laughtale.co.uk}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      ALLOW_EMAIL_LOGIN: "true"
      ALLOW_SOCIAL_LOGIN: "false"
      ENDPOINTS: openAI,anthropic,agents
      ANTHROPIC_API_KEY: ${CLAUDE_API_KEY}
      ANTHROPIC_MODELS: claude-sonnet-5,claude-opus-4-7,claude-sonnet-4-6,claude-haiku-4-5-20251001
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODELS: gpt-4o,gpt-4o-mini
      MCP_STATIC_TOKEN: ${MCP_STATIC_TOKEN:-}
    volumes:
      - ./config/librechat.yaml:/app/librechat.yaml:ro
      - ./config/assets/logo.svg:/app/client/public/assets/logo.svg:ro
      - ./config/assets/logo.svg:/app/client/dist/assets/logo.svg:ro
      - ./config/assets/logo-login.svg:/app/client/public/assets/logo-login.svg:ro
      - ./config/assets/logo-login.svg:/app/client/dist/assets/logo-login.svg:ro
      - ./config/assets/login-logo.js:/app/client/public/assets/login-logo.js:ro
      - ./config/assets/login-logo.js:/app/client/dist/assets/login-logo.js:ro
      - ./config/assets/favicon-16x16.png:/app/client/public/assets/favicon-16x16.png:ro
      - ./config/assets/favicon-16x16.png:/app/client/dist/assets/favicon-16x16.png:ro
      - ./config/assets/favicon-32x32.png:/app/client/public/assets/favicon-32x32.png:ro
      - ./config/assets/favicon-32x32.png:/app/client/dist/assets/favicon-32x32.png:ro
      - ./data/librechat/images:/app/client/public/images
      - ./data/librechat/logs:/app/api/logs
    depends_on:
      - mongodb
      - meilisearch
      - search-mcp

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - librechat

  watchtower:
    image: containrrr/watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      DOCKER_API_VERSION: "1.41"
    command: --interval 3600
